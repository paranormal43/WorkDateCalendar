<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f6fb" />
    <title>ตารางทำงาน 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --paper: #f3f6fb;
        --card: #ffffff;
        --ink: #0f172a;
        --muted: #64748b;
        --line: #e2e8f0;
        --line-strong: #cbd5e1;

        /* Dayshift palette (Radiant Sunlit Amber) */
        --day-bg: linear-gradient(180deg, #fffbeb 0%, #fef3c7 100%);
        --day-border: #fcd34d;
        --day-ink: #78350f;
        --day-hero: linear-gradient(135deg, #fffbeb 0%, #fef3c7 52%, #fde68a 100%);

        /* Nightshift palette (Luminous Twilight Indigo) */
        --night-bg: linear-gradient(180deg, #eef2ff 0%, #dfe7fd 100%);
        --night-border: #a5b4fc;
        --night-ink: #1e1b4b;
        --night-hero: linear-gradient(135deg, #0f172a 0%, #1e1b4b 52%, #312e81 100%);

        /* Off-day palette (Calm Neutral & Botanical Mint Hero) */
        --off-bg: #f8fafc;
        --off-border: #e2e8f0;
        --off-ink: #64748b;
        --off-hero: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 55%, #bbf7d0 100%);
        --off-hero-border: #86efac;
        --off-hero-ink: #14532d;

        --shadow-sm: 0 2px 6px rgba(15, 23, 42, 0.04), 0 1px 2px rgba(15, 23, 42, 0.03);
        --shadow-md: 0 10px 26px rgba(15, 23, 42, 0.07), 0 2px 6px rgba(15, 23, 42, 0.04);

        --focus: #2563eb;
        --r: 22px;
        --font: "Anuphan", "Noto Sans Thai", "Sarabun", system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background-color: var(--paper);
        background-image:
          radial-gradient(at 0% 0%, rgba(254, 243, 199, 0.65) 0px, transparent 52%),
          radial-gradient(at 100% 0%, rgba(224, 231, 255, 0.72) 0px, transparent 52%);
        background-attachment: fixed;
        color: var(--ink);
        font: 400 1rem/1.55 var(--font);
        min-height: 100vh;
      }

      button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
      button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
      button:active { transform: scale(0.96); }

      .app {
        max-width: 1180px;
        margin: 0 auto;
        padding: max(14px, env(safe-area-inset-top)) 12px max(40px, env(safe-area-inset-bottom));
      }

      /* Header + Legend Bar in front of Today button */
      header {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 16px;
      }
      h1 { margin: 0; font-size: 1.5rem; line-height: 1.3; font-weight: 700; letter-spacing: -0.01em; }
      .sub { margin: 0; color: var(--muted); font-size: 0.9375rem; }

      .head-tools {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        background: rgba(255, 255, 255, 0.74);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid rgba(226, 232, 240, 0.9);
        border-radius: 20px;
        padding: 7px 9px 7px 10px;
        box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04), 0 1px 2px rgba(15, 23, 42, 0.02);
      }

      .legend {
        display: grid;
        grid-template-columns: repeat(2, auto);
        gap: 6px 8px;
        font-size: 0.8125rem;
        font-weight: 500;
      }
      .lg-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px 4px 7px;
        border-radius: 999px;
        white-space: nowrap;
        line-height: 1.2;
      }
      .lg-day {
        background: #fffdf5;
        border: 1px solid rgba(251, 191, 36, 0.45);
        color: #92400e;
      }
      .lg-night {
        background: #f5f7ff;
        border: 1px solid rgba(165, 180, 252, 0.5);
        color: #3730a3;
      }
      .lg-off {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        color: #475569;
      }
      .lg-today {
        background: #ffffff;
        border: 1px solid #cbd5e1;
        color: #334155;
      }
      .lg-dot {
        width: 8px;
        height: 8px;
        margin: 0 3px;
        border-radius: 50%;
        background: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.16);
        flex: none;
      }

      .btn-today {
        min-height: 42px;
        padding: 0 16px;
        border: 1px solid #cbd5e1;
        border-radius: 999px;
        background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
        color: #1e293b;
        font-weight: 600;
        font-size: 0.9375rem;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        flex: none;
        box-shadow: 0 2px 6px rgba(15, 23, 42, 0.05);
        transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
      }
      .btn-today svg {
        color: #2563eb;
      }

      .layout {
        display: grid;
        gap: 14px;
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas: "hero" "week" "cal";
      }

      /* shift colours, shared by chips, cells, swatches */
      .t-day {
        background: var(--day-bg);
        border: 1px solid var(--day-border);
        color: var(--day-ink);
      }
      .t-night {
        background: var(--night-bg);
        border: 1px solid var(--night-border);
        color: var(--night-ink);
      }
      .t-off {
        background: var(--off-bg);
        border: 1px solid var(--off-border);
        color: var(--off-ink);
      }

      /* hero */
      .hero {
        position: relative;
        overflow: hidden;
        grid-area: hero;
        border-radius: var(--r);
        padding: 22px;
        display: grid;
        gap: 16px;
        border: 1px solid var(--line);
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.2s ease;
      }
      .hero::before {
        content: "";
        position: absolute;
        right: -36px;
        bottom: -48px;
        width: 190px;
        height: 190px;
        border-radius: 50%;
        pointer-events: none;
        opacity: 0.5;
      }
      .hero > * {
        position: relative;
        z-index: 1;
      }
      .hero.is-day {
        background: var(--day-hero);
        border-color: #fbbf24;
        color: var(--day-ink);
        box-shadow: 0 12px 28px rgba(217, 119, 6, 0.14), 0 2px 6px rgba(217, 119, 6, 0.08);
      }
      .hero.is-day::before {
        background: radial-gradient(circle, rgba(251, 191, 36, 0.55) 0%, transparent 70%);
      }
      .hero.is-night {
        background: var(--night-hero);
        border-color: #4f46e5;
        color: #ffffff;
        box-shadow: 0 12px 30px rgba(30, 27, 75, 0.28), 0 2px 8px rgba(30, 27, 75, 0.16);
      }
      .hero.is-night::before {
        background: radial-gradient(circle, rgba(129, 140, 248, 0.45) 0%, transparent 70%);
      }
      .hero.is-off {
        background: var(--off-hero);
        border-color: var(--off-hero-border);
        color: var(--off-hero-ink);
        box-shadow: 0 12px 28px rgba(21, 128, 61, 0.12), 0 2px 6px rgba(21, 128, 61, 0.06);
      }
      .hero.is-off::before {
        background: radial-gradient(circle, rgba(74, 222, 128, 0.45) 0%, transparent 70%);
      }

      .hero-date { font-weight: 600; opacity: 0.94; }
      .hero-main { display: flex; align-items: center; gap: 16px; }
      .hero-icon {
        width: 74px;
        height: 74px;
        flex: none;
        display: grid;
        place-items: center;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.86);
        box-shadow: 0 6px 16px rgba(15, 23, 42, 0.08);
      }
      .is-day .hero-icon { border: 1px solid rgba(251, 191, 36, 0.55); }
      .is-night .hero-icon {
        background: rgba(255, 255, 255, 0.13);
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.22);
      }
      .is-off .hero-icon { border: 1px solid rgba(134, 239, 172, 0.65); }

      .hero-name { margin: 0 0 6px; font-size: 2rem; line-height: 1.2; font-weight: 700; letter-spacing: -0.02em; }
      .pips { display: flex; align-items: center; gap: 6px; font-size: 0.9375rem; font-weight: 500; }
      .pip { width: 26px; height: 8px; border-radius: 4px; background: currentColor; opacity: 0.22; }
      .pip.on { opacity: 1; }
      .pips span { margin-left: 6px; }
      .hero-note { margin: 0; font-weight: 600; font-size: 1.0625rem; opacity: 0.95; }

      /* next 7 days */
      .week {
        grid-area: week;
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 6px;
        padding: 3px;
      }
      .chip {
        min-height: 82px;
        border-radius: 15px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        line-height: 1.15;
        cursor: pointer;
        padding: 6px 2px;
        box-shadow: var(--shadow-sm);
        transition: filter 0.12s ease, transform 0.1s ease;
      }
      .chip small { font-size: 0.8125rem; font-weight: 600; opacity: 0.88; }
      .chip b { font-size: 1.125rem; font-weight: 700; }
      .chip-ic {
        width: 22px;
        height: 22px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .chip-ic svg { width: 22px; height: 22px; }
      .chip.today {
        box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--ink);
        z-index: 1;
      }
      .chip.today small::after { content: " •"; }

      /* calendar card */
      .cal {
        grid-area: cal;
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 14px 12px;
        box-shadow: var(--shadow-md);
      }
      .cal-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
      .cal-title { flex: 1; margin: 0; font-size: 1.375rem; line-height: 1.3; font-weight: 700; }
      .cal-title small { color: var(--muted); font-size: 0.9375rem; font-weight: 500; margin-left: 6px; }
      .icon-btn {
        width: 46px;
        height: 46px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 50%;
        background: #fff;
        cursor: pointer;
        box-shadow: var(--shadow-sm);
        transition: background 0.15s ease, border-color 0.15s ease;
      }
      .seg {
        order: 3;
        width: 100%;
        display: flex;
        padding: 4px;
        border-radius: 999px;
        background: #eef2f7;
        border: 1px solid var(--line);
      }
      .seg button {
        flex: 1;
        min-height: 40px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
      }
      .seg button[aria-pressed="true"] {
        background: #fff;
        color: var(--ink);
        box-shadow: 0 2px 6px rgba(15, 23, 42, 0.1);
      }

      .wd, .days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
      .wd { margin-bottom: 6px; }
      .wd span { text-align: center; padding: 4px 0; font-size: 0.875rem; font-weight: 700; color: var(--muted); }
      .wd .sun { color: #ef4444; }
      .days { padding: 4px; margin: -4px; }

      .cell {
        position: relative;
        aspect-ratio: 1 / 1.24;
        padding: 5px 2px;
        border-radius: 14px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
      }
      .cell .n { font-size: 1.0625rem; font-weight: 700; line-height: 1.1; }
      .cell-ic {
        width: 24px;
        height: 24px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .cell-ic svg { width: 24px; height: 24px; }

      .cell.today {
        box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--ink);
        z-index: 1;
      }
      .cell.today::after {
        content: "";
        position: absolute;
        top: 5px;
        right: 5px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }

      /* year overview (Version 3 full 12-month cards) */
      .year {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
      }
      .ym-card {
        display: block;
        width: 100%;
        padding: 14px 12px;
        text-align: left;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: #ffffff;
        cursor: pointer;
        box-shadow: var(--shadow-sm);
        transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
      }
      .ym-card.cur {
        border: 1.5px solid #64748b;
        box-shadow: 0 8px 22px rgba(15, 23, 42, 0.08);
      }
      .ym-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
        padding-bottom: 8px;
        border-bottom: 1px solid #eef2f6;
      }
      .ym-title {
        font-size: 1.125rem;
        font-weight: 700;
        color: var(--ink);
      }
      .ym-tag {
        font-size: 0.75rem;
        font-weight: 700;
        color: #ffffff;
        background: var(--ink);
        padding: 2px 10px;
        border-radius: 999px;
      }
      .ym-wd {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 4px;
        margin-bottom: 6px;
        text-align: center;
      }
      .ym-wd span {
        font-size: 0.8125rem;
        font-weight: 700;
        color: var(--muted);
        padding: 2px 0;
      }
      .ym-wd .sun { color: #ef4444; }
      .ym-days {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 4px;
      }
      .ym-empty { min-height: 46px; }
      .ym-cell {
        min-height: 46px;
        border-radius: 10px;
        padding: 4px 2px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        position: relative;
      }
      .ym-n {
        font-size: 0.9375rem;
        font-weight: 700;
        line-height: 1.1;
      }
      .ym-cell.t-off .ym-n { font-weight: 600; }
      .ym-ic {
        height: 15px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
      }
      .ym-cell.today {
        box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px var(--ink);
        z-index: 1;
      }
      .ym-cell.t-off.today {
        background: #ffffff;
        color: var(--ink);
      }

      @media (hover: hover) {
        .chip:hover { filter: brightness(0.96); }
        .icon-btn:hover {
          background: #f8fafc;
          border-color: #94a3b8;
        }
        .ym-card:hover {
          border-color: #94a3b8;
          box-shadow: 0 6px 18px rgba(15, 23, 42, 0.07);
        }
        .btn-today:hover {
          background: #ffffff;
          border-color: #93c5fd;
          color: #1d4ed8;
          box-shadow: 0 4px 12px rgba(37, 99, 235, 0.12);
        }
      }

      @media (min-width: 640px) {
        .app { padding-left: 24px; padding-right: 24px; }
        h1 { font-size: 1.75rem; }
        .legend {
          display: flex;
          flex-wrap: wrap;
          align-items: center;
          gap: 8px;
          font-size: 0.84375rem;
        }
        .head-tools {
          border-radius: 999px;
          padding: 6px 8px 6px 10px;
          gap: 10px;
        }
        .cal { padding: 20px; }
        .year { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
        .ym-empty, .ym-cell { min-height: 44px; }
        .ym-n { font-size: 0.875rem; }
        .seg { order: 0; width: auto; }
        .seg button { padding: 0 22px; }
      }

      @media (min-width: 820px) {
        header {
          flex-direction: row;
          align-items: center;
          justify-content: space-between;
        }
        .cell { aspect-ratio: 1 / 0.96; gap: 5px; }
        .cell .n { font-size: 1.25rem; }
        .cell-ic, .cell-ic svg { width: 29px; height: 29px; }
      }

      @media (min-width: 960px) {
        .app { padding-top: 28px; padding-bottom: 56px; }
        header { margin-bottom: 20px; }
        .layout { gap: 18px; }
        .cal { padding: 24px; }
        .cal-title { font-size: 1.625rem; }
        .cell { aspect-ratio: auto; min-height: 92px; }
        .year { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <div>
          <h1>ตารางกะ</h1>
          <p class="sub">ทำ 4 วัน หยุด 2 วัน สลับกะอัตโนมัติ</p>
        </div>
        <div class="head-tools">
          <div class="legend" id="legend" aria-label="คำอธิบายสัญลักษณ์"></div>
          <button type="button" id="jumpTodayBtn" class="btn-today">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="4" width="18" height="18" rx="2.5"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
              <circle cx="12" cy="15" r="1.8" fill="currentColor"></circle>
            </svg>
            วันนี้
          </button>
        </div>
      </header>

      <div class="layout">
        <section id="hero" class="hero is-day" aria-live="polite"></section>
        <div id="week" class="week" aria-label="7 วันข้างหน้า"></div>

        <section class="cal">
          <div class="cal-head">
            <h2 id="calTitle" class="cal-title"></h2>
            <div class="seg" role="group" aria-label="มุมมอง">
              <button type="button" id="modeMonth" aria-pressed="true">เดือน</button>
              <button type="button" id="modeYear" aria-pressed="false">ทั้งปี</button>
            </div>
            <button type="button" id="prevBtn" class="icon-btn" aria-label="ก่อนหน้า">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <button type="button" id="nextBtn" class="icon-btn" aria-label="ถัดไป">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
          </div>
          <div id="calBody"></div>
        </section>
      </div>
    </div>

    <script>
      // =========================================================================
      // ตั้งค่าสำหรับ GitHub Pages (แก้แค่ 2 บรรทัดนี้)
      // - firstOffDate: วันหยุดวันแรก 'YYYY-MM-DD' (นับเป็นวันหยุด 2 วันติดกันอัตโนมัติ)
      // - shiftAfterOff: กะที่เข้าหลังหยุดครบ 2 วัน ('day' หรือ 'night')
      // =========================================================================
      const STATIC_CONFIG = {
        firstOffDate: "2026-11-14",
        shiftAfterOff: "night",
      };

      (function () {
        const MONTHS = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
        const WD = ["อา", "จ", "อ", "พ", "พฤ", "ศ", "ส"];
        const WDF = ["อาทิตย์", "จันทร์", "อังคาร", "พุธ", "พฤหัสบดี", "ศุกร์", "เสาร์"];
        const LABEL = { day: "กะกลางวัน", night: "กะกลางคืน", off: "วันหยุด" };

        // Large Hero Icons (46x46)
        const HERO_ICON = {
          day: '<svg width="46" height="46" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9.2" fill="#fbbf24" opacity="0.24"></circle><circle cx="12" cy="12" r="5" fill="#f59e0b" stroke="#d97706" stroke-width="1.6"></circle><path d="M12 2v2.5M12 19.5V22M4.93 4.93l1.75 1.75M17.32 17.32l1.75 1.75M2 12h2.5M19.5 12H22M6.68 17.32l-1.75 1.75M19.07 4.93l-1.75 1.75" stroke="#d97706" stroke-width="2.1" stroke-linecap="round"></path></svg>',
          night: '<svg width="46" height="46" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="#818cf8" opacity="0.22"></circle><path d="M20.5 14.4A8.5 8.5 0 0 1 9.6 3.5a8.5 8.5 0 1 0 10.9 10.9z" fill="#fde047" stroke="#facc15" stroke-width="1.4" stroke-linejoin="round"></path><path d="M18.2 3.5l.8 1.9 1.9.8-1.9.8-.8 1.9-.8-1.9-1.9-.8 1.9-.8.8-1.9z" fill="#fef08a"></path><circle cx="14.4" cy="8.6" r="1.1" fill="#fef08a"></circle></svg>',
          off: '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M18 8h1a3.5 3.5 0 0 1 0 7h-1" stroke="#15803d" stroke-width="2" stroke-linecap="round"></path><path d="M3 8h15v7.5A4.5 4.5 0 0 1 13.5 20h-6A4.5 4.5 0 0 1 3 15.5V8z" fill="#86efac" fill-opacity="0.48" stroke="#15803d" stroke-width="2" stroke-linejoin="round"></path><path d="M7 2.5v2.5M10.5 2v3M14 2.5v2.5" stroke="#15803d" stroke-width="2" stroke-linecap="round"></path></svg>',
        };

        // Scalable Duotone Icons for Cells, 7-Day Chips & Header Legend
        const ICON = {
          day: (s) => '<svg' + (s ? ' width="' + s + '" height="' + s + '"' : "") + ' viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4.8" fill="#f59e0b" stroke="#d97706" stroke-width="1.6"></circle><path d="M12 2.2v2.5M12 19.3v2.5M5.07 5.07l1.75 1.75M17.18 17.18l1.75 1.75M2.2 12h2.5M19.3 12h2.5M6.82 17.18l-1.75 1.75M18.93 5.07l-1.75 1.75" stroke="#d97706" stroke-width="2.1" stroke-linecap="round"></path></svg>',
          night: (s) => '<svg' + (s ? ' width="' + s + '" height="' + s + '"' : "") + ' viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20.4 14.5A8.4 8.4 0 0 1 9.5 3.6a8.4 8.4 0 1 0 10.9 10.9z" fill="#4338ca" stroke="#3730a3" stroke-width="1.4" stroke-linejoin="round"></path><path d="M18 3.6l.78 1.82 1.82.78-1.82.78-.78 1.82-.78-1.82-1.82-.78 1.82-.78.78-1.82z" fill="#6366f1"></path></svg>',
          off: (s) => '<svg' + (s ? ' width="' + s + '" height="' + s + '"' : "") + ' viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M17.5 8.5h1a3 3 0 0 1 0 6h-1" stroke="#64748b" stroke-width="1.9" stroke-linecap="round"></path><path d="M3.5 8.5h14v6.5a4 4 0 0 1-4 4h-6a4 4 0 0 1-4-4V8.5z" fill="#cbd5e1" fill-opacity="0.6" stroke="#64748b" stroke-width="1.9" stroke-linejoin="round"></path><path d="M7.5 3v2M11 2.5v2.5M14.5 3v2" stroke="#64748b" stroke-width="1.9" stroke-linecap="round"></path></svg>',
        };

        const CELL_ICON = {
          day: ICON.day(),
          night: ICON.night(),
          off: ICON.off(),
        };

        const $ = (id) => document.getElementById(id);
        const pad = (n) => String(n).padStart(2, "0");
        const key = (y, m, d) => y + "-" + pad(m + 1) + "-" + pad(d);
        const idx = (y, m, d) => Math.floor(Date.UTC(y, m, d) / 86400000);
        const fromIdx = (i) => {
          const t = new Date(i * 864e5);
          return { y: t.getUTCFullYear(), m: t.getUTCMonth(), d: t.getUTCDate() };
        };
        const dow = (y, m, d) => new Date(Date.UTC(y, m, d)).getUTCDay();
        const fullDate = (y, m, d) => "วัน" + WDF[dow(y, m, d)] + "ที่ " + d + " " + MONTHS[m] + " " + (y + 543);

        function validDate(s) {
          if (typeof s !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
          const [y, m, d] = s.split("-").map(Number);
          const t = new Date(Date.UTC(y, m - 1, d));
          return t.getUTCFullYear() === y && t.getUTCMonth() === m - 1 && t.getUTCDate() === d;
        }

        const firstOff = validDate(STATIC_CONFIG.firstOffDate) ? STATIC_CONFIG.firstOffDate : "2026-01-01";
        const firstShift = STATIC_CONFIG.shiftAfterOff === "night" ? "night" : "day";
        const secondShift = firstShift === "day" ? "night" : "day";
        const [ay, am, ad] = firstOff.split("-").map(Number);
        const anchor = idx(ay, am - 1, ad);

        // รอบ 12 วัน: หยุด 2 -> กะแรก 4 -> หยุด 2 -> กะที่สอง 4
        function info(y, m, d) {
          const pos = (((idx(y, m, d) - anchor) % 12) + 12) % 12;
          if (pos < 2) return { type: "off", n: pos + 1, total: 2, next: firstShift };
          if (pos < 6) return { type: firstShift, n: pos - 1, total: 4, next: "off" };
          if (pos < 8) return { type: "off", n: pos - 5, total: 2, next: secondShift };
          return { type: secondShift, n: pos - 7, total: 4, next: "off" };
        }

        function note(i) {
          const left = i.total - i.n;
          if (i.type === "off") {
            return left === 0 ? "พรุ่งนี้เข้า" + LABEL[i.next] : "หยุดอีก " + left + " วัน แล้วเข้า" + LABEL[i.next];
          }
          return left === 0 ? "วันสุดท้ายของกะ พรุ่งนี้หยุด" : "ทำอีก " + left + " วัน แล้วหยุด 2 วัน";
        }

        let now = new Date();
        let T = { y: now.getFullYear(), m: now.getMonth(), d: now.getDate() };
        const st = { y: T.y, m: T.m, mode: "month" };

        function renderHero() {
          const i = info(T.y, T.m, T.d);
          let pips = "";
          for (let k = 0; k < i.total; k++) pips += '<i class="pip' + (k < i.n ? " on" : "") + '"></i>';
          const hero = $("hero");
          hero.className = "hero is-" + i.type;
          hero.innerHTML =
            '<div class="hero-date">วันนี้ ' + fullDate(T.y, T.m, T.d) + "</div>" +
            '<div class="hero-main"><div class="hero-icon">' + HERO_ICON[i.type] + "</div><div>" +
            '<h2 class="hero-name">' + LABEL[i.type] + "</h2>" +
            '<div class="pips">' + pips + "<span>วันที่ " + i.n + " จาก " + i.total + "</span></div></div></div>" +
            '<p class="hero-note">' + note(i) + "</p>";
        }

        function renderWeek() {
          const base = idx(T.y, T.m, T.d);
          let h = "";
          for (let k = 0; k < 7; k++) {
            const p = fromIdx(base + k);
            const i = info(p.y, p.m, p.d);
            const ds = key(p.y, p.m, p.d);
            h +=
              '<button type="button" class="chip t-' + i.type + (k === 0 ? " today" : "") +
              '" data-date="' + ds + '" aria-label="' + fullDate(p.y, p.m, p.d) + " " + LABEL[i.type] + '">' +
              "<small>" + WD[dow(p.y, p.m, p.d)] + "</small><b>" + p.d + '</b><span class="chip-ic">' + CELL_ICON[i.type] + "</span></button>";
          }
          $("week").innerHTML = h;
        }

        function monthBody() {
          const { y, m } = st;
          let h = '<div class="wd">';
          WD.forEach((w, k) => (h += "<span" + (k ? "" : ' class="sun"') + ">" + w + "</span>"));
          h += '</div><div class="days">';
          for (let e = dow(y, m, 1); e > 0; e--) h += "<span></span>";
          const last = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
          for (let d = 1; d <= last; d++) {
            const i = info(y, m, d);
            const isToday = y === T.y && m === T.m && d === T.d;
            h +=
              '<div class="cell t-' + i.type + (isToday ? " today" : "") +
              '" aria-label="' + d + " " + MONTHS[m] + " " + (y + 543) + " " + LABEL[i.type] +
              (isToday ? " (วันนี้)" : "") + '">' +
              '<span class="n">' + d + '</span><span class="cell-ic">' + CELL_ICON[i.type] + "</span></div>";
          }
          return h + "</div>";
        }

        const YEAR_ICON = {
          day: ICON.day(15),
          night: ICON.night(14),
          off: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true"><line x1="6" y1="12" x2="18" y2="12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" opacity="0.65"></line></svg>',
        };

        function yearBody() {
          const y = st.y;
          let h = '<div class="year">';
          for (let m = 0; m < 12; m++) {
            const cur = y === T.y && m === T.m;
            h +=
              '<div class="ym-card' + (cur ? " cur" : "") + '" data-month="' + m + '" role="button" tabindex="0" aria-label="เปิด' + MONTHS[m] + '">' +
              '<div class="ym-head"><span class="ym-title">' + MONTHS[m] + "</span>" +
              (cur ? '<span class="ym-tag">เดือนนี้</span>' : "") + "</div>" +
              '<div class="ym-wd">';
            WD.forEach((w, k) => (h += "<span" + (k ? "" : ' class="sun"') + ">" + w + "</span>"));
            h += '</div><div class="ym-days">';
            for (let e = dow(y, m, 1); e > 0; e--) h += '<div class="ym-empty"></div>';
            const last = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
            for (let d = 1; d <= last; d++) {
              const i = info(y, m, d);
              const isToday = cur && d === T.d;
              h +=
                '<div class="ym-cell t-' + i.type + (isToday ? " today" : "") + '">' +
                '<span class="ym-n">' + d + '</span><span class="ym-ic">' + YEAR_ICON[i.type] + "</span></div>";
            }
            h += "</div></div>";
          }
          return h + "</div>";
        }

        function renderCal() {
          const isMonth = st.mode === "month";
          $("calTitle").innerHTML = isMonth
            ? MONTHS[st.m] + " " + (st.y + 543) + "<small>ค.ศ. " + st.y + "</small>"
            : "ปี " + (st.y + 543) + "<small>ค.ศ. " + st.y + "</small>";
          $("modeMonth").setAttribute("aria-pressed", String(isMonth));
          $("modeYear").setAttribute("aria-pressed", String(!isMonth));
          $("prevBtn").setAttribute("aria-label", isMonth ? "เดือนก่อนหน้า" : "ปีก่อนหน้า");
          $("nextBtn").setAttribute("aria-label", isMonth ? "เดือนถัดไป" : "ปีถัดไป");
          $("calBody").innerHTML = isMonth ? monthBody() : yearBody();
        }

        function renderLegend() {
          $("legend").innerHTML =
            '<span class="lg-pill lg-day">' + ICON.day(16) + "กะกลางวัน</span>" +
            '<span class="lg-pill lg-night">' + ICON.night(15) + "กะกลางคืน</span>" +
            '<span class="lg-pill lg-off">' + ICON.off(15) + "วันหยุด</span>" +
            '<span class="lg-pill lg-today"><i class="lg-dot"></i>วันนี้</span>';
        }

        function renderAll() {
          renderHero();
          renderWeek();
          renderCal();
        }

        function step(dir) {
          if (st.mode === "year") {
            st.y += dir;
          } else {
            st.m += dir;
            if (st.m < 0) { st.m = 11; st.y--; }
            if (st.m > 11) { st.m = 0; st.y++; }
          }
          renderCal();
        }

        function goToday() {
          now = new Date();
          T = { y: now.getFullYear(), m: now.getMonth(), d: now.getDate() };
          st.y = T.y;
          st.m = T.m;
          st.mode = "month";
          renderAll();
        }

        $("prevBtn").addEventListener("click", () => step(-1));
        $("nextBtn").addEventListener("click", () => step(1));
        $("modeMonth").addEventListener("click", () => { st.mode = "month"; renderCal(); });
        $("modeYear").addEventListener("click", () => { st.mode = "year"; renderCal(); });
        $("jumpTodayBtn").addEventListener("click", () => {
          goToday();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
        $("hero").addEventListener("click", goToday);

        $("week").addEventListener("click", (e) => {
          const b = e.target.closest("[data-date]");
          if (!b) return;
          const [y, mm] = b.dataset.date.split("-").map(Number);
          st.y = y;
          st.m = mm - 1;
          st.mode = "month";
          renderCal();
        });

        $("calBody").addEventListener("click", (e) => {
          const mini = e.target.closest("[data-month]");
          if (mini) {
            st.m = Number(mini.dataset.month);
            st.mode = "month";
            renderCal();
          }
        });

        // ปัดซ้าย/ขวาเพื่อเปลี่ยนเดือนบนมือถือ
        let sx = 0, sy = 0;
        $("calBody").addEventListener("touchstart", (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
        $("calBody").addEventListener("touchend", (e) => {
          const dx = e.changedTouches[0].clientX - sx;
          const dy = e.changedTouches[0].clientY - sy;
          if (Math.abs(dx) > 60 && Math.abs(dy) < 45) step(dx < 0 ? 1 : -1);
        }, { passive: true });

        // ซิงค์วันนี้เมื่อเปิดหน้าใหม่หรือกลับมาจากแท็บอื่น
        window.addEventListener("pageshow", goToday);
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState !== "visible") return;
          const c = new Date();
          if (c.getFullYear() !== T.y || c.getMonth() !== T.m || c.getDate() !== T.d) goToday();
        });

        renderLegend();
        goToday();
      })();
    </script>
  </body>
</html>
